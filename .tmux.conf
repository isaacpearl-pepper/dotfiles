# Enable mouse navigation
set -g mouse on 

# Remap window splits and pane swaps
bind i split-window -h -c "#{pane_current_path}"
bind l split-window -h -l 80 -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind j swap-pane -D
bind u swap-pane -U
unbind '"'
unbind %

# Set prefix to ctrl-a
set -g prefix C-a 

# This allows you to switch directly to windows with cntrl + number
# https://unix.stackexchange.com/questions/96884/using-ctrl0-9-to-cycle-between-windows-using-tmux
bind-key -n C-0 select-window -t :0
bind-key -n C-1 select-window -t :1
bind-key -n C-2 select-window -t :2
bind-key -n C-3 select-window -t :3
bind-key -n C-4 select-window -t :4
bind-key -n C-5 select-window -t :5
bind-key -n C-6 select-window -t :6
bind-key -n C-7 select-window -t :7
bind-key -n C-8 select-window -t :8
bind-key -n C-9 select-window -t :9

# Select panes with Vim keys
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

    bind-key -n C-h  if-shell  "$is_vim"  "send-keys C-h"  "select-pane -L"
    bind-key -n C-j   if-shell  "$is_vim"  "send-keys C-j"   "select-pane -D"
    bind-key -n C-k  if-shell  "$is_vim"  "send-keys C-k"  "select-pane -U"
    bind-key -n C-l   if-shell  "$is_vim"  "send-keys C-l"   "select-pane -R"
    bind-key -n C-\   if-shell  "$is_vim"  "send-keys C-\\"  "select-pane -l"

# Start numbering windows from index 1
set -g base-index 1

# Rename panes with directory name automatically
set-option -g status-interval 5
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'

# Renumbers windows when a window is closed
set-option -g renumber-windows on

# Reorder windows with ctrl + shift + left/right arrow
bind-key -n C-S-Left swap-window -d -t -1
bind-key -n C-S-Right swap-window -d -t +1

# Navigate windows with ctrl + left/right arrow
bind-key -n C-Left select-window -t -1
bind-key -n C-Right select-window -t +1

# Vim keys
setw -g mode-keys vi

# Statusline constants
emoji="  "
set -g status-bg "#001898"

# STATUSLINE LEFT
# Session name 
set -g status-left "#[fg=black,bg=black,bold] #S #[fg=blue,bg=default,nobold,noitalics,nounderscore]"
# Window name focused
set -g window-status-current-format "#[fg=white,bg=#1F2335]   #I #W  "
# Window name unfocused 
set -g window-status-format "#[fg=brightwhite,bg=default,nobold,noitalics,nounderscore]   #I #W #F  "

# STATUSLINE RIGHT
set -g status-right "#[fg=white,bg=#24283B] #[] %H:%M #[fg=black,bg=green,bold]"
set -g window-status-separator ""

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'erikw/tmux-powerline'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
